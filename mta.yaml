_schema-version: "3.1"
ID: jones-vob
version: 1.0.0
description: Jones Vendor Onboarding (VOB)
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm run build:cap

modules:
  - name: vob-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    properties:
      NODE_ENV: production
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: vob-db
      - name: vob-uaa
      - name: vob-destination
      - name: vob-connectivity
      - name: vob-malware-scanner
      - name: vob-audit-log

  - name: vob-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: vob-db

  - name: vob-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: vob-uaa
      - name: srv-api
        group: destinations
        properties:
          name: vob-srv
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: vob-audit-log
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: vob-audit-log
  - name: vob-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: vob-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  - name: vob-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: vob-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: vob-malware-scanner
    type: org.cloudfoundry.managed-service
    parameters:
      service: malware-scanner
      service-plan: clamav
